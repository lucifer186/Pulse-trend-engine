# version: "3.8"

# ── Named volumes ── persistent storage for containers ──
# volumes:
#   zookeeper_data:
#   kafka_data:
#   minio_data:

# ── All services start together with: docker compose up ──
services:

  # ── 1. ZOOKEEPER ─────────────────────────────────────
  # Kafka needs Zookeeper to coordinate brokers
  # Think of it as Kafka's internal manager
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: pulse-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181      # port Kafka talks to Zookeeper on
      ZOOKEEPER_TICK_TIME: 2000        # heartbeat interval in ms
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 2. KAFKA BROKER ──────────────────────────────────
  # The message bus — Reddit/HN posts flow through here as messages
  # Producers write to topics, consumers read from topics
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pulse-kafka
    depends_on:
      zookeeper:
        condition: service_healthy     # wait for zookeeper to be ready first
    ports:
      - "9092:9092"                    # external port — your Python scripts connect here
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # PLAINTEXT_HOST = accessible from your laptop (Python scripts)
      # PLAINTEXT      = internal between containers
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1   # single broker, so 1 replica
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"      # auto-create topics when first message arrives
      KAFKA_LOG_RETENTION_HOURS: 168               # keep messages for 7 days
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ── 3. KAFKA UI ───────────────────────────────────────
  # Browser dashboard: see topics, messages, consumer groups live
  # Open: http://localhost:8080
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: pulse-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: pulse-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092   # internal network address

  # ── 4. MINIO ─────────────────────────────────────────
  # S3-compatible local object storage
  # Your Bronze Delta Lake files land here
  # Console: http://localhost:9001  |  API: http://localhost:9000
  minio:
    image: minio/minio:latest
    container_name: pulse-minio
    ports:
      - "9000:9000"    # S3 API endpoint — PySpark connects here
      - "9001:9001"    # browser console
    environment:
      MINIO_ROOT_USER: pulseadmin          # login for console
      MINIO_ROOT_PASSWORD: pulsepassword123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 5. AIRFLOW ───────────────────────────────────
  # Workflow orchestrator — schedules Silver job every 30 min
  # UI: http://localhost:8081
  airflow:
    build: .
    container_name: pulse-airflow
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      _PIP_ADDITIONAL_REQUIREMENTS: "s3fs pyspark"   # ← add this line
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__WEBSERVER__SECRET_KEY: pulse-secret-key-2024
      # Pass MinIO config into Airflow container
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: pulseadmin
      MINIO_ROOT_PASSWORD: pulsepassword123
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      NEWS_API_KEY: ${NEWS_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      KAFKA_BROKER: kafka:29092


    volumes:
      # DAGs folder
      - ./airflow/dags:/opt/airflow/dags
      # ── Mount your ENTIRE project into container ──
      - /home/mike12/pulse-trend-engine:/opt/pulse
      # Airflow logs
      - airflow_logs:/opt/airflow/logs

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
        --username admin
        --password admin
        --firstname Pulse
        --lastname Admin
        --role Admin
        --email admin@pulse.local || true &&
      airflow scheduler &
      airflow webserver
      "
volumes:
  zookeeper_data:
  kafka_data:
  minio_data:
  airflow_logs:
